    <script>
      // 1. Declare Iterator as top-level global var so bare identifier Iterator is always defined
      if (typeof Iterator === 'undefined') {
        var Iterator = function Iterator() {};
        try {
          var iterProto = Object.getPrototypeOf(Object.getPrototypeOf([][Symbol.iterator]()));
          Iterator.prototype = iterProto || {};
        } catch (e) {
          Iterator.prototype = {};
        }
        Iterator.from = function(o) {
          if (o && typeof o[Symbol.iterator] === 'function') return o[Symbol.iterator]();
          return o;
        };
      }
      if (typeof window !== 'undefined') window.Iterator = Iterator;
      if (typeof globalThis !== 'undefined') globalThis.Iterator = Iterator;
      if (Iterator && !Iterator.prototype) Iterator.prototype = {};
      if (Iterator && typeof Iterator.prototype.join !== 'function') {
        Iterator.prototype.join = function(sep) {
          return Array.from(this).join(sep === undefined ? ',' : sep);
        };
      }

      // 2. Promise.withResolvers (Chrome < 119)
      if (typeof Promise.withResolvers === 'undefined') {
        Promise.withResolvers = function() {
          var resolve, reject;
          var promise = new Promise(function(res, rej) { resolve = res; reject = rej; });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }

      // 3. URL.parse & URL.canParse (Chrome < 120/126)
      if (!URL.parse) {
        URL.parse = function(url, base) { try { return new URL(url, base); } catch(e) { return null; } };
      }
      if (!URL.canParse) {
        URL.canParse = function(url, base) { try { new URL(url, base); return true; } catch(e) { return false; } };
      }

      // 4. Map.prototype.getOrInsertComputed (pdfjs TC39 proposal)
      if (typeof Map.prototype.getOrInsertComputed !== 'function') {
        Map.prototype.getOrInsertComputed = function(key, callbackfn) {
          if (this.has(key)) return this.get(key);
          var val = callbackfn(key);
          this.set(key, val);
          return val;
        };
      }

      // 5. Object.groupBy & Map.groupBy (Chrome < 117)
      if (!Object.groupBy) {
        Object.groupBy = function(items, cb) {
          var res = Object.create(null), idx = 0;
          for (var item of items) {
            var key = cb(item, idx++);
            if (key in res) res[key].push(item); else res[key] = [item];
          }
          return res;
        };
      }

      // 6. Array change-by-copy methods (Chrome < 110)
      if (!Array.prototype.toReversed) {
        Array.prototype.toReversed = function() { return this.slice().reverse(); };
      }
      if (!Array.prototype.toSorted) {
        Array.prototype.toSorted = function(fn) { return this.slice().sort(fn); };
      }
      if (!Array.prototype.toSpliced) {
        Array.prototype.toSpliced = function(start, deleteCount) {
          var copy = this.slice();
          var items = Array.prototype.slice.call(arguments, 2);
          copy.splice.apply(copy, [start, deleteCount].concat(items));
          return copy;
        };
      }
    </script>
